# Builds https://porelo-ai.github.io from the doc/ of every repository porelo-project's project.yml names, checks it
# strict, and publishes it with GitHub Pages once publishing is switched on.
#
# What: every repository at its default branch (2026-10-05), not at its newest release.
#
# When: every night and by hand, always; every hour, only when a repository's default branch moved since the last
# build. That is how a push reaches the site within the hour without any other repository holding a token that
# could write here.
#
# Publishing is off until the repositories are public (2026-10-04): the site is built and
# checked from now on, and published only where the repository variable PUBLISH is 'true'. Until then the
# repositories are read with PORELO_DOCS_READ, a fine-grained token with Contents: read on them and nothing else;
# once they are public the token goes, and so does every line that names it.
name: Documentation site

on:
    schedule:
        - cron: '23 2 * * *'
        - cron: '7 * * * *'
    workflow_dispatch:
    push:
        branches: [main]
        # The image a Porelo task builds in changes nothing on the site. Workflows alone build nothing either: an
        # action's move is checked by its pull request, and the next push with content builds with it.
        paths-ignore: ['porelo.yml', '.github/**']

permissions:
    contents: read

# One at a time, and a run that started is let finish.
concurrency:
    group: site
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-24.04
        # A push also fetches the pinned GraalVM and the shared build tools for its commit messages.
        timeout-minutes: 10
        # The Python the wheels in the cache are built for; the build job names the same. Per job, so the prune job,
        # which holds a write token, inherits no variable at all.
        env:
            PYTHON: '3.13'
        outputs:
            changed: ${{ steps.decide.outputs.changed }}
            key: ${{ steps.compare.outputs.key }}
            wheels: ${{ steps.wheels.outputs.cache-primary-key }}
            wrapper: ${{ steps.wrapper.outputs.cache-primary-key }}
            repository: ${{ steps.repository.outputs.cache-primary-key }}
        steps:
            # Every commit, so the pushed range can be read.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Its credential would be sent beside the read token, and GitHub refuses two Authorization headers.
                  persist-credentials: false
                  fetch-depth: 0

            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ env.PYTHON }}

            # The pinned packages themselves, fetched from PyPI once per pin: pip's own cache would still ask PyPI's
            # index on every run. No older entry is restored in its place, so the entry holds this pin's packages only.
            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: wheels
              with:
                  path: ${{ runner.temp }}/wheels
                  key: pip-wheels-${{ runner.os }}-python${{ env.PYTHON }}-${{ hashFiles('build/requirements.txt') }}

            # Each package is checked against its hash when it is fetched and again when it is installed from the cache.
            # Wheels only: a source package would need build tools from PyPI to install without it.
            - name: The pinned tools, every package by its hash
              env:
                  WHEELS: ${{ runner.temp }}/wheels
                  FOUND: ${{ steps.wheels.outputs.cache-hit }}
              run: |
                  set -euo pipefail
                  if [ "$FOUND" != true ]; then
                      python -m pip download --no-deps --require-hashes --only-binary=:all: -d "$WHEELS" \
                          -r build/requirements.txt
                  fi
                  python -m pip install --no-index --find-links "$WHEELS" --no-deps --require-hashes \
                      -r build/requirements.txt

            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: steps.wheels.outputs.cache-hit != 'true'
              with:
                  path: ${{ runner.temp }}/wheels
                  key: ${{ steps.wheels.outputs.cache-primary-key }}

            - name: The collector's tests
              run: python -m unittest discover -s tests

            # The wrapper's Maven and the shared build tools as the Shared rules check keeps them, under the same keys.
            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: github.event_name == 'push'
              id: wrapper
              with:
                  path: ~/.m2/wrapper
                  key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: github.event_name == 'push'
              id: repository
              with:
                  path: ~/.m2/repository
                  key: maven-repository-${{ runner.os }}-${{ hashFiles('build/pom.xml') }}

            # As the Shared rules check takes them: the runner's Java 25 runs porelo-machines once, which installs the
            # pinned GraalVM, checked against its digest, as JAVA_HOME for the step after it.
            - name: The shared build tools and the pinned GraalVM
              if: github.event_name == 'push'
              run: |
                  set -eu
                  [ -n "${JAVA_HOME_25_X64:-}" ] || { echo "::error::this runner has no Java 25 (JAVA_HOME_25_X64)"; exit 1; }
                  export JAVA_HOME="$JAVA_HOME_25_X64"
                  # The wrapper fetches its Maven once, checks it against distributionSha256Sum and installs it only whole, so
                  # asking it again after a failed fetch is a retry; a cached one answers at once.
                  for attempt in 1 2 3 4 5; do
                      if ./mvnw -B -q --version >/dev/null; then
                          break
                      fi
                      if [ "$attempt" = 5 ]; then
                          echo "::error::the wrapper could not fetch its Maven in 5 attempts"
                          exit 1
                      fi
                      echo "::warning::the wrapper's Maven did not arrive (attempt $attempt); trying again"
                      sleep $((attempt * 10))
                  done
                  ./mvnw -B -q -f build/pom.xml dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/tools-cp.txt"
                  "$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.machines.Main jdk --github

            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: github.event_name == 'push' && steps.wrapper.outputs.cache-hit != 'true'
              with:
                  path: ~/.m2/wrapper
                  key: ${{ steps.wrapper.outputs.cache-primary-key }}

            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: github.event_name == 'push' && steps.repository.outputs.cache-hit != 'true'
              with:
                  path: ~/.m2/repository
                  key: ${{ steps.repository.outputs.cache-primary-key }}

            # A direct push to main never meets the pull request's check, so the push's own range is read here. Only main
            # is pushed to start this workflow, and main itself cannot be pushed over.
            - name: The pushed commits' messages
              if: github.event_name == 'push'
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  set -eu
                  case "$PUSH_BEFORE" in
                      '') echo "::error::the push names no commit it started from"; exit 1 ;;
                  esac
                  if ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                      echo "::error::main moved from $PUSH_BEFORE, a commit this checkout does not hold"
                      exit 1
                  fi
                  "$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main \
                      check-commits "$PUSH_BEFORE..$GITHUB_SHA"

            - name: What would be taken now
              id: compare
              env:
                  PORELO_DOCS_READ: ${{ secrets.PORELO_DOCS_READ }}
              run: |
                  python build/assemble.py --out "$RUNNER_TEMP/unused" --manifest > now.json
                  echo "key=site-$(sha256sum now.json | cut -c1-16)" >> "$GITHUB_OUTPUT"

            # The last build leaves its manifest's key in the cache; an hourly run that finds it has nothing new to build.
            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: built
              with:
                  path: now.json
                  key: ${{ steps.compare.outputs.key }}
                  lookup-only: true

            - name: Whether anything moved since the last build
              id: decide
              env:
                  HOURLY: ${{ github.event.schedule == '7 * * * *' }}
                  FOUND: ${{ steps.built.outputs.cache-hit }}
              run: |
                  if [ "$HOURLY" = true ] && [ "$FOUND" = true ]; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    echo "Nothing moved since the last build."
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

    build:
        needs: check
        if: needs.check.outputs.changed != 'false'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        # The same Python as the check job's, whose cached wheels it installs.
        env:
            PYTHON: '3.13'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Its credential would be sent beside the read token, and GitHub refuses two Authorization headers.
                  persist-credentials: false

            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: ${{ env.PYTHON }}

            # As the check job takes them, which saved them for this pin before.
            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: wheels
              with:
                  path: ${{ runner.temp }}/wheels
                  key: pip-wheels-${{ runner.os }}-python${{ env.PYTHON }}-${{ hashFiles('build/requirements.txt') }}

            - name: The pinned tools, every package by its hash
              env:
                  WHEELS: ${{ runner.temp }}/wheels
                  FOUND: ${{ steps.wheels.outputs.cache-hit }}
              run: |
                  set -euo pipefail
                  if [ "$FOUND" != true ]; then
                      python -m pip download --no-deps --require-hashes --only-binary=:all: -d "$WHEELS" \
                          -r build/requirements.txt
                  fi
                  python -m pip install --no-index --find-links "$WHEELS" --no-deps --require-hashes \
                      -r build/requirements.txt

            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: steps.wheels.outputs.cache-hit != 'true'
              with:
                  path: ${{ runner.temp }}/wheels
                  key: ${{ steps.wheels.outputs.cache-primary-key }}

            - name: Every repository's doc/, in porelo-project's order
              env:
                  PORELO_DOCS_READ: ${{ secrets.PORELO_DOCS_READ }}
              run: python build/assemble.py --out "$RUNNER_TEMP/site"

            - name: The site, strict
              run: mkdocs build --strict --config-file "$RUNNER_TEMP/site/mkdocs.yml"

            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: ${{ runner.temp }}/site/site

            - name: What this build took, for the next hourly run to compare with
              run: cp "$RUNNER_TEMP/site/site/parts.json" now.json

            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: now.json
                  key: ${{ needs.check.outputs.key }}

    # Only the newest entry of each cache is kept, so the cache never overflows. A job of its own, so the token that may
    # delete never meets the tools the other jobs fetch. Main's run deletes every older entry; any other run only its
    # own ref's, never main's, which main still restores. By id, since one key may stand under several refs. Every run,
    # so a delete that failed is tried again; a failure - a fork's read-only token above all - only warns. GitHub's
    # cache API alone: another forge's token never goes there.
    prune:
        needs: [check, build]
        if: ${{ !cancelled() && github.server_url == 'https://github.com' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            actions: write
        steps:
            - name: Only the newest entry of each cache
              env:
                  GH_TOKEN: ${{ github.token }}
                  # One cache a line: the prefix its entries share, and the key the run restored or saved.
                  KEEP: |
                      pip-wheels-${{ runner.os }}- ${{ needs.check.outputs.wheels }}
                      maven-wrapper-${{ runner.os }}- ${{ needs.check.outputs.wrapper }}
                      maven-repository-${{ runner.os }}- ${{ needs.check.outputs.repository }}
                      site- ${{ needs.build.result == 'success' && needs.check.outputs.key || '' }}
              run: |
                  set -euo pipefail
                  scope=(--ref "$GITHUB_REF")
                  if [ "$GITHUB_REF" = refs/heads/main ]; then
                      scope=()
                  fi
                  while read -r prefix keep; do
                      # A cache the run did not restore or save names no key, and nothing of it is deleted.
                      if [ -z "${keep:-}" ]; then
                          continue
                      fi
                      if ! entries=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" "${scope[@]}" \
                          --limit 100 --json id,key --jq '.[] | "\(.id) \(.key)"'); then
                          echo "::warning::the cache entries under $prefix could not be listed; older ones stay for now"
                          continue
                      fi
                      while read -r id key; do
                          if [ -z "${id:-}" ] || [ "$key" = "$keep" ]; then
                              continue
                          fi
                          if gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; then
                              echo "Deleted the older cache entry $key."
                          else
                              echo "::warning::the older cache entry $key could not be deleted; the next run retries"
                          fi
                      done <<< "$entries"
                  done <<< "$KEEP"

    publish:
        needs: build
        # Off until the repositories are public: set the repository variable PUBLISH to 'true' once they are.
        if: github.ref == 'refs/heads/main' && vars.PUBLISH == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
