# Checks the documents: AGENTS.md's shared block against its hash, and no citation of an issue that goes stale, with
# the shared build tools from Central. Of its own because the site's build is about other repositories' pages, and it
# leases no machine.
name: Shared rules check

# Once a day, not on a push: every hand-over runs the same checks locally on its exact commit first, and a run per
# push spent build minutes on what was already known. 03:17 UTC lies outside the hours the repositories are worked in.
on:
    schedule:
        - cron: '17 3 * * *'
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Nothing here pushes, so the job's token has no business staying in .git/config.
                  persist-credentials: false

            # Maven by the wrapper's pinned distribution and digest; the runner's own Java 25 only runs porelo-machines once,
            # which installs the pinned GraalVM, checked against its digest, as JAVA_HOME for the steps after it.
            - name: The shared build tools and the pinned GraalVM
              run: |
                  set -eu
                  [ -n "${JAVA_HOME_25_X64:-}" ] || { echo "::error::this runner has no Java 25 (JAVA_HOME_25_X64)"; exit 1; }
                  export JAVA_HOME="$JAVA_HOME_25_X64"
                  ./mvnw -B -q -f build/pom.xml dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/tools-cp.txt"
                  "$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.machines.Main jdk --github

            - name: The shared block against its hash
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-shared AGENTS.md'

            - name: No citation of an issue that goes stale
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-citations .'

            - name: The tests that read documents
              run: python3 -m unittest discover -s tests -p 'test_documents_*.py'

            # A pull request's own commits held to the shared rule on commit messages. One from outside - from another
            # repository, or opened by someone not a member - also carries its author's Signed-off-by: on each commit,
            # the Developer Certificate of Origin; Dependabot's and GitHub's own commits are exempt by the author and
            # committer they record.
            - name: The pull request's commit messages
              if: github.event_name == 'pull_request'
              env:
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
              run: |
                  set -eu
                  # The checkout holds the merge commit alone; the range needs the history of both its sides.
                  if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                      git fetch --no-tags --quiet --unshallow origin "$PR_BASE" "$PR_HEAD"
                  else
                      git fetch --no-tags --quiet origin "$PR_BASE" "$PR_HEAD"
                  fi
                  outside=--outside
                  if [ "$PR_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
                      case "$PR_ASSOCIATION" in OWNER | MEMBER) outside= ;; esac
                  fi
                  "$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main \
                      check-commits "$PR_BASE..$PR_HEAD" $outside
