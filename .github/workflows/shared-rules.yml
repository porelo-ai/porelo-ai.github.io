# Checks the documents: AGENTS.md's shared block against its hash, and no citation of an issue that goes stale, with
# the shared build tools from Central. Of its own because the site's build is about other repositories' pages, and it
# leases no machine.
name: Shared rules check

# Once a day, not on a push: every hand-over runs the same checks locally on its exact commit first, and a run per
# push spent build minutes on what was already known. 03:17 UTC lies outside the hours the repositories are worked in.
on:
    schedule:
        - cron: '17 3 * * *'
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            wrapper: ${{ steps.wrapper.outputs.cache-primary-key }}
            repository: ${{ steps.repository.outputs.cache-primary-key }}
        steps:
            # Every commit, so the scheduled run reads main's last day without a second fetch.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Nothing here pushes, so the job's token has no business staying in .git/config.
                  persist-credentials: false
                  fetch-depth: 0

            # The wrapper's Maven, fetched once per pin: without it every job fetched it with one wget and no retry, and a
            # single network hiccup failed a Build (2026-11-06). Restored and saved apart: saved once filled, so a check
            # that fails later still leaves it to the next run.
            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: wrapper
              with:
                  path: ~/.m2/wrapper
                  key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

            # The shared build tools and every plugin and library they need, fetched from Central once per pom. No older
            # entry is restored in its place: its leftovers would be saved again under the new key and only ever grow.
            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: repository
              with:
                  path: ~/.m2/repository
                  key: maven-repository-${{ runner.os }}-${{ hashFiles('build/pom.xml') }}

            # Maven by the wrapper's pinned distribution and digest; the runner's own Java 25 only runs porelo-machines once,
            # which installs the pinned GraalVM, checked against its digest, as JAVA_HOME for the steps after it.
            - name: The shared build tools and the pinned GraalVM
              run: |
                  set -eu
                  [ -n "${JAVA_HOME_25_X64:-}" ] || { echo "::error::this runner has no Java 25 (JAVA_HOME_25_X64)"; exit 1; }
                  export JAVA_HOME="$JAVA_HOME_25_X64"
                  # The wrapper fetches its Maven once, checks it against distributionSha256Sum and installs it only whole, so
                  # asking it again after a failed fetch is a retry; a cached one answers at once.
                  for attempt in 1 2 3 4 5; do
                      if ./mvnw -B -q --version >/dev/null; then
                          break
                      fi
                      if [ "$attempt" = 5 ]; then
                          echo "::error::the wrapper could not fetch its Maven in 5 attempts"
                          exit 1
                      fi
                      echo "::warning::the wrapper's Maven did not arrive (attempt $attempt); trying again"
                      sleep $((attempt * 10))
                  done
                  ./mvnw -B -q -f build/pom.xml dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/tools-cp.txt"
                  "$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.machines.Main jdk --github

            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: steps.wrapper.outputs.cache-hit != 'true'
              with:
                  path: ~/.m2/wrapper
                  key: ${{ steps.wrapper.outputs.cache-primary-key }}

            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: steps.repository.outputs.cache-hit != 'true'
              with:
                  path: ~/.m2/repository
                  key: ${{ steps.repository.outputs.cache-primary-key }}

            - name: The shared block against its hash
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-shared AGENTS.md'

            - name: No citation of an issue that goes stale
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-citations .'

            - name: The tests that read documents
              run: python3 -m unittest discover -s tests -p 'test_documents_*.py'

            # A pull request's own commits held to the shared rule on commit messages. One from outside - from another
            # repository, or opened by someone not a member - also carries its author's Signed-off-by: on each commit,
            # the Developer Certificate of Origin; Dependabot's and GitHub's own commits are exempt by the author and
            # committer they record. The repository's own workflow opens its pull requests from a branch only a holder
            # of write access can push, so those are from inside, though GitHub names their author a contributor. The
            # host's forge names no author association at all; there too only write access pushes a branch of the same
            # repository, and only the person's approval merges it, so such a pull request is from inside.
            - name: The pull request's commit messages
              if: github.event_name == 'pull_request'
              env:
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  PR_SERVER: ${{ github.server_url }}
              run: |
                  set -eu
                  # The checkout holds every commit, both sides of the merge among them, so nothing is fetched again.
                  outside=--outside
                  if [ "$PR_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
                      case "$PR_ASSOCIATION" in OWNER | MEMBER) outside= ;; esac
                      if [ "$PR_AUTHOR" = 'github-actions[bot]' ]; then
                          outside=
                      fi
                      if [ "$PR_SERVER" != 'https://github.com' ]; then
                          outside=
                      fi
                  fi
                  "$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main \
                      check-commits "$PR_BASE..$PR_HEAD" $outside

            # A push the site never builds on, of [skip ci] commits or of workflows alone, meets no check of its own, so
            # each day main's commits of the last 26 hours are read, with two hours over the schedule's own day.
            - name: Main's commits of the last day
              if: github.event_name == 'schedule'
              run: |
                  set -eu
                  # A repository younger than that is read whole, its first commit too.
                  start=$(git rev-list -1 --before='26 hours ago' HEAD)
                  "$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main \
                      check-commits "${start:+$start..}HEAD"

    # Only the newest entry of each cache is kept, so the cache never overflows. A job of its own, so the token that may
    # delete never meets the tools the other jobs fetch. Main's run deletes every older entry; any other run only its
    # own ref's, never main's, which main still restores. By id, since one key may stand under several refs. Every run,
    # so a delete that failed is tried again; a failure - a fork's read-only token above all - only warns. GitHub's
    # cache API alone: another forge's token never goes there.
    prune:
        needs: check
        if: ${{ !cancelled() && github.server_url == 'https://github.com' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            actions: write
        steps:
            - name: Only the newest entry of each cache
              env:
                  GH_TOKEN: ${{ github.token }}
                  # One cache a line: the prefix its entries share, and the key the run restored or saved.
                  KEEP: |
                      maven-wrapper-${{ runner.os }}- ${{ needs.check.outputs.wrapper }}
                      maven-repository-${{ runner.os }}- ${{ needs.check.outputs.repository }}
              run: |
                  set -euo pipefail
                  scope=(--ref "$GITHUB_REF")
                  if [ "$GITHUB_REF" = refs/heads/main ]; then
                      scope=()
                  fi
                  while read -r prefix keep; do
                      # A cache the run did not restore or save names no key, and nothing of it is deleted.
                      if [ -z "${keep:-}" ]; then
                          continue
                      fi
                      if ! entries=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" "${scope[@]}" \
                          --limit 100 --json id,key --jq '.[] | "\(.id) \(.key)"'); then
                          echo "::warning::the cache entries under $prefix could not be listed; older ones stay for now"
                          continue
                      fi
                      while read -r id key; do
                          if [ -z "${id:-}" ] || [ "$key" = "$keep" ]; then
                              continue
                          fi
                          if gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; then
                              echo "Deleted the older cache entry $key."
                          else
                              echo "::warning::the older cache entry $key could not be deleted; the next run retries"
                          fi
                      done <<< "$entries"
                  done <<< "$KEEP"
